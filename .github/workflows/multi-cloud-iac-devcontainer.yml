name: Validate multi-cloud-iac devcontainer

on:
  pull_request:
    paths:
      - "multi-cloud-iac/**"
      - ".github/workflows/multi-cloud-iac-devcontainer.yml"
  push:
    branches:
      - main
    paths:
      - "multi-cloud-iac/**"
      - ".github/workflows/multi-cloud-iac-devcontainer.yml"

permissions:
  contents: read

jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build devcontainer image
        run: docker build -f multi-cloud-iac/.devcontainer/Dockerfile multi-cloud-iac/.devcontainer
